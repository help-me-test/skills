skill: helpmetest
mode: validate
strip_rf_preamble: false
output_constraints: |-
  Output format — structured report, nothing else:

    GRADE: <A|B|C|D|F>
    FAILS: <comma-separated rule IDs e.g. R1, R9 — or NONE>
    <for each failed rule, one line: R<N>: <one-sentence evidence citing the specific line or absence>

  Rules:
  - GRADE is A (9-10 pass), B (7-8), C (5-6), D (3-4), F (<3 or R12 fail)
  - R11/R12/R13 failures each lower the final grade by one tier (A→B, B→C, etc.)
  - R12 FAIL = automatic F regardless of R1-R10 score
  - N/A rules are excluded from the score denominator
  - No prose before GRADE:. No extra lines after the last evidence line.

description: >-
  Evals for the validate mode — verifies that R1–R13 rules are scored correctly
  when reviewing a test. Each case provides a test in [NAME]/[TAGS]/[BODY]
  format and checks the grade and failed rules mechanically.

prompt_preamble: |-
  You are applying the validate mode to a test definition. Score the test against
  the R1–R13 quality rules. For each rule, determine PASS, FAIL, or N/A. Grade the
  test and produce a structured report.

  The test is provided in this format:
    [NAME]
    <test name>
    [/NAME]

    [TAGS]
    <space-separated tags>
    [/TAGS]

    [BODY]
    <Robot Framework test body>
    [/BODY]

  Scoring rules:

  R1 — Asserts an outcome, not presence.
    FAIL if no assertion, or only Should Be Visible / Wait For Element.
    PASS when there is at least one Should Be Equal, Should Contain, Should Match, data
    check, or state query.

  R2 — 5+ meaningful steps.
    Count Go To, Fill Text, Click, Get Text, assertions. Sleep, Log, comments don't count.
    FAIL if fewer than 5.

  R4 — Uses FakeMail for emails.
    N/A if no email field in the test.
    FAIL if test hardcodes test@example.com or similar static addresses.
    FAIL if test uses timestamp-based email instead of Create Fake Email.
    PASS when Create Fake Email or Create Email And Fill is used with Delete Email in teardown.

  R5 — Uses As <StateName> for auth, not re-login.
    N/A if feature doesn't require auth.
    FAIL if test fills login form and clicks login button.
    PASS when As <StateName> is the first meaningful line.

  R6 — No blocked patterns.
    FAIL if Evaluate __import__ or Evaluate lambda is used.
    FAIL if Sleep is used without a one-line why-comment explaining the reason.
    PASS when no blocked patterns and no unjustified sleep.

  R7 — Selectors prefer role/text/testid.
    FAIL if more than 50% of selectors are chained CSS classes, nth-child, or deep descendants.
    PASS when [data-testid=...], role=, text=, [aria-label=...] dominate.

  R8 — Tags are complete.
    Required: project:X, feature:<id>, persona:<name>, priority:<level>, url:<base-url>.
    FAIL if any required tag is missing.

  R9 — Name follows the pattern, no vague or "test" names.
    FAIL if the word "test" appears anywhere in the name — "test login flow", "login test",
    "checkout test case" all fail R9. The word "test" adds no information and signals a vague name.
    FAIL if name is about implementation (button names, CSS classes).
    FAIL if name is too vague to describe what is verified.
    Examples of R9 FAIL: "test login flow", "checkout test", "user test", "test settings page"
    Examples of R9 PASS: "User can log in with valid credentials", "Checkout completes and shows order ID"

  R10 — Has priority: and feature: tags.
    FAIL if priority: or feature: tags are missing (subset of R8 — score both if both fail).

  R11 — Mutation resistance.
    FAIL if the test would pass even when the code under test is broken — e.g., asserts
    element is visible but not that it works, clicks submit but checks no data change.

  R12 — Tests our business logic, not framework behavior.
    FAIL if test directly calls ORM (prisma.findMany, mongoose.save), crypto library
    (bcrypt.hash), HTTP client (axios.get), or JWT library (jwt.sign).
    Automatic F grade regardless of R1-R10 score.

  R13 — Minimal mocking.
    FAIL if more than 3-4 mocks are set up, or if pure functions or business logic are mocked.

  Grading (R1-R10, counting only applicable rules):
    A: 9-10 PASS
    B: 7-8 PASS
    C: 5-6 PASS
    D: 3-4 PASS
    F: <3 PASS
  Each R11/R13 FAIL lowers by one tier. R12 FAIL = automatic F.

  CRITICAL: Cite the specific line or specific absence for every FAIL. "no assertion anywhere
  in the body" is evidence. "line 7 uses Sleep  2s without a comment" is evidence. Vague claims are not.

evals:
  - id: 1
    rules: [R1]
    violation: Only Should Be Visible — proves presence, not function
    input: |
      [NAME]
      User can open the dashboard
      [/NAME]

      [TAGS]
      project:helpmetest feature:dashboard persona:helpmetest priority:high url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Auth and open the app
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/
        Wait For Elements State  css=nav  visible  timeout=15s

      # Navigate to dashboard
        Click  [data-testid="dashboard-link"]
        Wait For Elements State  [data-testid="dashboard-panel"]  visible  timeout=10s
        Should Be Visible  [data-testid="dashboard-panel"]
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R1"
    must_not_contain:
      - "GRADE: A"
      - "GRADE: B"
      - "FAILS: NONE"

  - id: 2
    rules: [R2]
    violation: Only 3 meaningful steps — too shallow
    input: |
      [NAME]
      User can view the settings page
      [/NAME]

      [TAGS]
      project:helpmetest feature:settings persona:helpmetest priority:medium url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Open settings
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/settings
        ${heading}=  Get Text  css=h1
        Should Contain  ${heading}  Settings
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R2"
    must_not_contain:
      - "GRADE: A"
      - "GRADE: B"
      - "FAILS: NONE"

  - id: 4
    rules: [R4]
    violation: Hardcoded static email address fails on second run
    note: With only R4 failing and R5 N/A, grade B is correct (7/8 applicable pass). Only check R4 in FAILS.
    input: |
      [NAME]
      User can sign up with email
      [/NAME]

      [TAGS]
      project:helpmetest feature:auth persona:visitor priority:critical url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Open signup page
        Go To  https://helpmetest.slava.helpmetest.com/signup
        Wait For Elements State  css=h1  visible  timeout=15s

      # Fill signup form
        Fill Text  [data-testid="email"]  newuser@test.com
        Fill Text  [data-testid="password"]  SecurePass123!
        Click  [data-testid="signup-btn"]

      # Redirect to onboarding
        Wait For Elements State  [data-testid="onboarding-heading"]  visible  timeout=20s
        ${email}=  Get Text  [data-testid="account-email"]
        Should Contain  ${email}  newuser@test.com
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R4"
    must_not_contain:
      - "GRADE: A"
      - "FAILS: NONE"

  - id: 5
    rules: [R5]
    violation: Re-fills login form every run instead of using As state
    input: |
      [NAME]
      User can create a new project
      [/NAME]

      [TAGS]
      project:helpmetest feature:projects persona:helpmetest priority:high url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Login
        Go To  https://helpmetest.slava.helpmetest.com/login
        Fill Text  [data-testid="email"]  automation@helpmetest.com
        Fill Text  [data-testid="password"]  TestPass123
        Click  [data-testid="login-btn"]
        Wait For Elements State  [data-testid="dashboard"]  visible  timeout=20s

      # Create new project
        Go To  https://helpmetest.slava.helpmetest.com/projects
        Click  [data-testid="new-project"]
        Fill Text  [data-testid="project-name"]  Alpha
        Click  [data-testid="create"]

      # Project appears in the list
        Wait For Elements State  [data-testid="project-card"]  visible  timeout=10s
        ${title}=  Get Text  [data-testid="project-card"]:first-child h2
        Should Be Equal  ${title}  Alpha
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R5"
    must_not_contain:
      - "GRADE: A"
      - "FAILS: NONE"

  - id: 6
    rules: [R6]
    violation: Sleep used without a why-comment explaining the reason
    input: |
      [NAME]
      User can play back a recorded test run
      [/NAME]

      [TAGS]
      project:helpmetest feature:replay persona:helpmetest priority:high url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Auth and open replay
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/replay/run-001
        Wait For Elements State  [data-testid="video-player"]  visible  timeout=15s

      # Start playback and wait
        Click  [data-testid="play-btn"]
        Sleep  3s
        ${progress}=  Get Attribute  [data-testid="progress-bar"]  value
        Should Be True  ${progress} > 0  video did not advance: ${progress}
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R6"
    must_not_contain:
      - "GRADE: A"
      - "FAILS: NONE"

  - id: 7
    rules: [R7]
    violation: All selectors are chained CSS classes — fragile
    input: |
      [NAME]
      User can complete checkout
      [/NAME]

      [TAGS]
      project:shop feature:checkout persona:buyer priority:critical url:https://shop.example.com
      [/TAGS]

      [BODY]
      # Auth and open the store
        As  Buyer
        Go To  https://shop.example.com/
        Wait For Elements State  css=.main-nav.loaded  visible  timeout=15s

      # Open cart and proceed to checkout
        Click  css=.nav-bar .cart-icon.active
        Wait For Elements State  css=.drawer.cart-drawer.open  visible  timeout=5s
        Click  css=.cart-drawer .btn.primary.checkout-btn

      # Fill payment and submit
        Wait For Elements State  css=.checkout-form.step-payment  visible  timeout=10s
        Fill Text  css=.checkout-form input.card-number-field  4242424242424242
        Click  css=.checkout-form .actions .btn.submit.place-order

      # Confirm order
        Wait For Elements State  css=.order-confirmation.visible  visible  timeout=15s
        ${order_id}=  Get Text  css=.order-confirmation .order-id span
        Should Match Regexp  ${order_id}  ^ORD-\\d+$
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R7"
    must_not_contain:
      - "GRADE: A"
      - "FAILS: NONE"

  - id: 8
    rules: [R8, R10]
    violation: Missing persona, priority, and url tags — all required
    input: |
      [NAME]
      User can delete a test
      [/NAME]

      [TAGS]
      project:helpmetest feature:test-management
      [/TAGS]

      [BODY]
      # Auth and open test list
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/
        Wait For Elements State  [data-testid="test-list"]  visible  timeout=15s

      # Delete the first test
        Click  [data-testid="test-row"]:first-child [data-testid="delete-btn"]
        Wait For Elements State  [data-testid="confirm-dialog"]  visible  timeout=5s
        Click  [data-testid="confirm-delete"]

      # Test is gone from the list
        Wait For Elements State  [data-testid="empty-state"]  visible  timeout=10s
        ${count}=  Get Element Count  [data-testid="test-row"]
        Should Be Equal As Numbers  ${count}  0
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R8"
    must_not_contain:
      - "FAILS: NONE"

  - id: 9
    rules: [R9]
    violation: Name includes "test" and is vague about what is verified
    input: |
      [NAME]
      test login flow
      [/NAME]

      [TAGS]
      project:helpmetest feature:auth persona:helpmetest priority:critical url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Open login page
        Go To  https://helpmetest.slava.helpmetest.com/login
        Wait For Elements State  css=h1  visible  timeout=15s

      # Submit login form
        Fill Text  [data-testid="email"]  automation@helpmetest.com
        Fill Text  [data-testid="password"]  TestPass123
        Click  [data-testid="login-btn"]

      # Verify dashboard and account name
        Wait For Elements State  [data-testid="dashboard"]  visible  timeout=20s
        ${name}=  Get Text  [data-testid="account-name"]
        Should Contain  ${name}  automation
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R9"
    must_not_contain:
      - "GRADE: A"
      - "FAILS: NONE"

  - id: 10
    rules: [R11]
    violation: Test clicks submit but checks no data change — would pass even if submit handler is removed
    input: |
      [NAME]
      User can save profile settings
      [/NAME]

      [TAGS]
      project:helpmetest feature:profile persona:helpmetest priority:medium url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Auth and open profile settings
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/settings/profile
        Wait For Elements State  css=h1  visible  timeout=15s

      # Update display name and save
        Fill Text  [data-testid="display-name"]  New Name
        Click  [data-testid="save-btn"]

      # Confirm success banner appears
        Wait For Elements State  [data-testid="save-banner"]  visible  timeout=5s
        Should Be Visible  [data-testid="save-banner"]
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R11"
    must_not_contain:
      - "GRADE: A"
      - "GRADE: B"
      - "FAILS: NONE"

  - id: 11
    rules: [R12]
    violation: Test directly calls ORM methods — automatic F
    input: |
      [NAME]
      User record is persisted after registration
      [/NAME]

      [TAGS]
      project:helpmetest feature:auth persona:visitor priority:critical url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Call registration handler
        ${payload}=  Create Dictionary  email=test@example.com  password=SecurePass123
        ${result}=  Evaluate  prisma.user.create(data=${payload})  modules=prisma

      # Verify user row in DB
        ${user}=  Evaluate  prisma.user.findUnique(where={"email": "test@example.com"})  modules=prisma
        Should Not Be Equal  ${user}  ${None}
        Should Be Equal  ${user}[email]  test@example.com
      [/BODY]
    must_contain:
      - "GRADE: F"
      - "R12"
    must_not_contain:
      - "GRADE: A"
      - "GRADE: B"
      - "GRADE: C"
      - "GRADE: D"
      - "FAILS: NONE"

  - id: 12
    rules: [R13]
    violation: 6 mocks set up including pure business logic functions
    input: |
      [NAME]
      Discount calculation applies to order total
      [/NAME]

      [TAGS]
      project:shop feature:discounts persona:buyer priority:high url:https://shop.example.com
      [/TAGS]

      [BODY]
      # Set up mocks for the checkout calculation
        ${mock_cart}=  Create Mock Object  CartService
        ${mock_pricing}=  Create Mock Object  PricingEngine
        ${mock_discount}=  Create Mock Object  DiscountCalculator
        ${mock_tax}=  Create Mock Object  TaxService
        ${mock_inventory}=  Create Mock Object  InventoryChecker
        ${mock_logger}=  Create Mock Object  AuditLogger
        Set Mock Return Value  ${mock_cart}  getItems  ${ITEMS}
        Set Mock Return Value  ${mock_pricing}  getBasePrice  100.00
        Set Mock Return Value  ${mock_discount}  applyCode  80.00
        Set Mock Return Value  ${mock_tax}  calculate  84.80

      # Run checkout calculation
        ${total}=  Run Keyword  CheckoutService.calculateTotal  cart=${mock_cart}  code=SAVE20  pricing=${mock_pricing}  discount=${mock_discount}  tax=${mock_tax}  inventory=${mock_inventory}  logger=${mock_logger}
        Should Be Equal As Numbers  ${total}  84.80
      [/BODY]
    must_contain:
      - "GRADE:"
      - "FAILS:"
      - "R13"
    must_not_contain:
      - "GRADE: A"
      - "GRADE: B"
      - "FAILS: NONE"

  - id: 13
    rules: []
    violation: none — clean test, grade A
    input: |
      [NAME]
      User can create a smoke probe entry and find it in the suite list
      [/NAME]

      [TAGS]
      project:helpmetest feature:test-management persona:helpmetest priority:high url:https://helpmetest.slava.helpmetest.com
      [/TAGS]

      [BODY]
      # Auth and open the app
        As  Helpmetest
        Go To  https://helpmetest.slava.helpmetest.com/
        Wait For Elements State  css=nav  visible  timeout=15s

      # Create a new test
        Click  [data-testid="new-test-btn"]
        Fill Text  [data-testid="test-name"]  smoke-probe
        Click  [data-testid="save-btn"]

      # Test appears in the list with the correct name
        Wait For Elements State  [data-testid="test-list-item"]  visible  timeout=10s
        ${name}=  Get Text  [data-testid="test-list-item"]:first-child
        Should Be Equal  ${name}  smoke-probe
      [/BODY]
    must_contain:
      - "GRADE: A"
      - "FAILS: NONE"
    must_not_contain:
      - "GRADE: B"
      - "GRADE: C"
      - "GRADE: D"
      - "GRADE: F"
